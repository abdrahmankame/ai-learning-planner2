<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقدمي — AI Learning Planner</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .progress-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .progress-card { background: var(--surface); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); }
    .progress-value { font-size: 32px; font-weight: 700; color: var(--primary); }
    .progress-label { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .ai-summary { background: linear-gradient(135deg, #eef2ff, #f0fdf4); padding: 24px; border-radius: var(--radius); margin: 24px 0; border: 1px solid #c7d2fe; }
    .ai-summary h3 { margin-bottom: 12px; font-size: 18px; }
    .ai-summary p { line-height: 1.9; white-space: pre-wrap; }
    .progress-bar { height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); border-radius: 999px; transition: width 0.5s; }
    .assessment-item { background: var(--surface); padding: 16px 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    @media (max-width: 768px) { .progress-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <h3 style="margin-bottom:20px;">🧠 AI Planner</h3>
      <nav>
        <a href="/pages/dashboard.html">لوحة التحكم</a>
        <a href="/pages/create-plan.html">إنشاء خطة</a>
        <a href="/pages/progress.html" class="active">تقدمي</a>
        <a href="/pages/settings.html">الإعدادات</a>
        <a href="#" id="logout-link">تسجيل الخروج</a>
      </nav>
    </aside>
    <main class="main-content">
      <h1 style="margin-bottom:24px;">تقدمي 📊</h1>
      <div id="loading" class="loading"><div class="spinner"></div>جاري التحميل...</div>
      <div id="error-box" hidden><div class="empty-state"><div class="icon">⚠️</div><p id="error-text"></p></div></div>
      <div id="empty-box" hidden>
        <div class="empty-state">
          <div class="icon">📚</div>
          <p>لم تنشئ أي خطة بعد.</p>
          <a href="/pages/create-plan.html" class="btn btn-primary" style="margin-top:16px;display:inline-block">أنشئ خطتك الأولى</a>
        </div>
      </div>
      <div id="content" hidden>
        <div style="margin-bottom:24px;">
          <label for="plan-select" style="font-weight:600;margin-bottom:8px;display:block;">اختر الخطة:</label>
          <select id="plan-select" style="max-width:400px;padding:10px;border-radius:8px;border:1px solid var(--border);width:100%;"></select>
        </div>
        <div class="progress-grid">
          <div class="progress-card"><div class="progress-value" id="stat-completed">0</div><div class="progress-label">دروس مكتملة</div></div>
          <div class="progress-card"><div class="progress-value" id="stat-pct">0%</div><div class="progress-label">نسبة الإنجاز</div></div>
          <div class="progress-card"><div class="progress-value" id="stat-avg">—</div><div class="progress-label">متوسط الاختبارات</div></div>
          <div class="progress-card"><div class="progress-value" id="stat-time">0</div><div class="progress-label">دقائق تعلم</div></div>
        </div>
        <div class="progress-card" style="margin-bottom:24px;">
          <h3 style="margin-bottom:12px;font-size:16px;">التقدم الكلي</h3>
          <div class="progress-bar"><div class="progress-fill" id="main-progress-fill" style="width:0%"></div></div>
          <p style="color:var(--muted);font-size:14px;margin-top:8px;" id="progress-detail"></p>
        </div>
        <div id="ai-summary-box" class="ai-summary" hidden>
          <h3>🤖 توصيات المعلم الذكي</h3>
          <p id="ai-summary-text"></p>
        </div>
        <h2 style="margin:32px 0 16px;font-size:20px;">آخر الاختبارات</h2>
        <div id="assessments-list"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/progress.js"></script>
</body>
</html>
