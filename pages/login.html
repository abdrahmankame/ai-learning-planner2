<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — AI Learning Planner</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>مرحباً بعودتك</h1>
      <p class="subtitle">سجّل الدخول لمتابعة خطتك التعليمية</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">دخول</button>
        <p id="message" class="error-message" hidden></p>
      </form>
      <div style="text-align:center;margin:16px 0;color:var(--muted);">أو</div>
      <button id="google-btn" class="btn btn-outline" style="width:100%">الدخول بحساب Google</button>
      <p style="text-align:center;margin-top:20px;font-size:14px;">
        <a href="#" id="reset-link">نسيت كلمة المرور؟</a>
      </p>
      <p style="text-align:center;margin-top:8px;font-size:14px;">
        ليس لديك حساب؟ <a href="/pages/signup.html" style="color:var(--primary)">أنشئ حساباً</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { login, loginWithGoogle, resetPassword, translateAuthError } from "/js/auth.js";
    const form = document.getElementById("login-form");
    const msg = document.getElementById("message");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.hidden = true;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await login(email, password);
        window.location.href = "/pages/dashboard.html";
      } catch (err) {
        msg.textContent = translateAuthError(err.code);
        msg.hidden = false;
      }
    });
    document.getElementById("google-btn").addEventListener("click", async () => {
      try {
        await loginWithGoogle();
        window.location.href = "/pages/dashboard.html";
      } catch (err) {
        msg.textContent = translateAuthError(err.code);
        msg.hidden = false;
      }
    });
    document.getElementById("reset-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = prompt("أدخل بريدك الإلكتروني:");
      if (!email) return;
      try {
        await resetPassword(email);
        alert("تم إرسال رابط إعادة التعيين إلى بريدك.");
      } catch (err) {
        alert(translateAuthError(err.code));
      }
    });
  </script>
</body>
</html>
