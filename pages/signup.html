<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب — AI Learning Planner</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>أنشئ حسابك</h1>
      <p class="subtitle">ابدأ رحلتك التعليمية الذكية</p>
      <form id="signup-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور (6 أحرف على الأقل)</label>
          <input type="password" id="password" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">إنشاء حساب</button>
        <p id="message" class="error-message" hidden></p>
      </form>
      <p style="text-align:center;margin-top:20px;font-size:14px;">
        لديك حساب؟ <a href="/pages/login.html" style="color:var(--primary)">دخول</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { signUp, translateAuthError } from "/js/auth.js";
    import { validateEmail, validatePassword } from "/js/validators.js";
    const form = document.getElementById("signup-form");
    const msg = document.getElementById("message");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.hidden = true;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (!validateEmail(email)) {
        msg.textContent = "البريد الإلكتروني غير صالح."; msg.hidden = false; return;
      }
      if (!validatePassword(password)) {
        msg.textContent = "كلمة المرور قصيرة."; msg.hidden = false; return;
      }
      try {
        await signUp(email, password);
        window.location.href = "/pages/onboarding.html";
      } catch (err) {
        msg.textContent = translateAuthError(err.code);
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
