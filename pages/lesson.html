<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدرس — AI Learning Planner</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/learning.css" />
</head>
<body style="padding:20px;">
  <div id="loading" class="loading"><div class="spinner"></div>جاري تحميل الدرس...</div>
  <div id="error-box" hidden>
    <div class="empty-state">
      <div class="icon">⚠️</div>
      <p id="error-text"></p>
      <a href="/pages/dashboard.html" class="btn btn-outline" style="margin-top:16px;display:inline-block">العودة للوحة التحكم</a>
    </div>
  </div>
  <div id="content" class="lesson-layout" hidden>
    <article class="lesson-content">
      <a href="#" id="back-link" style="color:var(--muted);font-size:14px;">← العودة للخطة</a>
      <h1 id="lesson-title" style="margin-top:12px;"></h1>
      <p id="lesson-desc" style="color:var(--muted);"></p>
      <div class="lesson-objectives" id="objectives-box" hidden>
        <h3>🎯 أهداف الدرس</h3>
        <ul id="objectives-list"></ul>
      </div>
      <div class="lesson-body" id="lesson-body"></div>
      <div class="lesson-actions">
        <a id="quiz-link" class="btn btn-outline">📝 اختبار الدرس</a>
        <button id="complete-btn" class="btn btn-primary">✅ إكمال الدرس</button>
        <a id="next-link" class="btn btn-outline" hidden>الدرس التالي →</a>
      </div>
    </article>
    <aside class="tutor-panel">
      <div class="tutor-header">🤖 المعلم الذكي</div>
      <div class="tutor-messages" id="tutor-messages">
        <div class="tutor-msg ai">مرحباً! اسألني أي شيء عن هذا الدرس.</div>
      </div>
      <div class="tutor-input">
        <input type="text" id="tutor-input" placeholder="اكتب سؤالك..." />
        <button id="tutor-send">إرسال</button>
      </div>
    </aside>
  </div>
  <script type="module" src="/js/lessons.js"></script>
</body>
</html>
